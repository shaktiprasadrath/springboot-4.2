# Episode 3: one OTLP endpoint for traces, logs and metrics (common fallback, new in 4.2)
management.opentelemetry.otlp.endpoint=http://otel-collector:4318
management.opentelemetry.otlp.headers.authorization=Bearer demo-token
management.opentelemetry.otlp.compression=gzip
# a signal-specific setting still wins
management.otlp.tracing.endpoint=http://tracing-only:4318/v1/traces
