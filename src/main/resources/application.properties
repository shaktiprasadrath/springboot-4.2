spring.application.name=orders
payments.base-url=https://payments.example.com
payments.api-key=demo-key
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s
# Change 1: behind the gateway at /shop. Tomcat can't do use-prefix itself, so the framework strategy.
server.request.header.forwarded.strategy=framework
server.request.header.forwarded.use-prefix=true
